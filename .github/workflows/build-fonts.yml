name: Build WenSolata Mono

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out WenSolata Mono
        uses: actions/checkout@v7
        with:
          path: WenSolata-Mono
          persist-credentials: false

      - name: Check out Inconsolata 3.100
        uses: actions/checkout@v7
        with:
          repository: googlefonts/Inconsolata
          ref: fc1fc21081558b39a2db43bfd9b65bf9acb50701
          path: Inconsolata
          persist-credentials: false

      - name: Check out LXGW WenKai Mono Lite 1.530
        uses: actions/checkout@v7
        with:
          repository: lxgw/LxgwWenKai-Lite
          ref: b712c83d98acf977bacfb7fb010207802808bda9
          path: LxgwWenKai-Lite
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependency
        working-directory: WenSolata-Mono
        run: python -m pip install -r requirements.txt

      - name: Check the tag matches the build version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: WenSolata-Mono
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import build; print(build.VERSION)')"

      - name: Build Light, Regular, and Bold fonts
        working-directory: WenSolata-Mono
        run: ./build-family.sh

      - name: Build WOFF2 web fonts and site
        working-directory: WenSolata-Mono
        run: ./build-webfonts.sh

      - name: Check font metadata and metrics
        working-directory: WenSolata-Mono
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont

          import build

          paths = [
              Path("dist/WenSolataMono-Light.ttf"),
              Path("dist/WenSolataMono-Regular.ttf"),
              Path("dist/WenSolataMono-Bold.ttf"),
          ]
          styles = ("Light", "Regular", "Bold")
          weights = (300, 400, 700)
          for path, style, weight in zip(paths, styles, weights):
              font = TTFont(path, checkChecksums=2)
              names = font["name"]
              cmap = font.getBestCmap()
              os2 = font["OS/2"]
              assert names.getDebugName(1) == "WenSolata Mono"
              assert names.getDebugName(2) == style
              assert os2.usWeightClass == weight
              assert names.getName(1, 3, 1, 0x0804).toUnicode() == "慰文楷"
              assert names.getName(16, 3, 1, 0x0804).toUnicode() == "慰文楷"
              assert names.getDebugName(0) and "Inconsolata" in names.getDebugName(0)
              assert "wght=" in names.getDebugName(10) and "wdth=" in names.getDebugName(10)
              assert "SIL OPEN FONT LICENSE Version 1.1" in names.getDebugName(13)
              assert "fvar" not in font
              assert font["hmtx"].metrics[cmap[0x41]][0] == 500
              assert font["hmtx"].metrics[cmap[0x4E2D]][0] == 1000
              assert os2.ulCodePageRange1 & (1 << 18)
              assert not os2.ulCodePageRange1 & (1 << 20)
              assert font["meta"].data["dlng"] == "Latn,Hans"
              assert font["meta"].data["slng"] == "Latn,Hans"
              gsub = font["GSUB"].table
              dlig_inputs = [
                  [first, *ligature.Component]
                  for record in gsub.FeatureList.FeatureRecord
                  if record.FeatureTag == "dlig"
                  for index in record.Feature.LookupListIndex
                  for subtable in gsub.LookupList.Lookup[index].SubTable
                  for first, ligatures in subtable.ligatures.items()
                  for ligature in ligatures
              ]
              for text in ("->", "<-", "=>", ">=", "<=", "===", "!=="):
                  assert [cmap[ord(char)] for char in text] in dlig_inputs, text
          source_path = Path("../Inconsolata/fonts/variable/Inconsolata[wdth,wght].ttf")
          for path, axes in zip(
              paths,
              (
                  {"wdth": 87.5, "wght": 300},
                  {"wdth": 87.5, "wght": 350},
                  {"wdth": 90, "wght": 650},
              ),
          ):
              source = instantiateVariableFont(
                  TTFont(source_path), axes, inplace=True
              )
              source_name = source.getBestCmap()[0x41]
              source_glyph = source["glyf"][source_name]
              source_glyph.recalcBounds(source["glyf"])
              expected_width = source_glyph.xMax - source_glyph.xMin
              font = TTFont(path)
              glyph_name = font.getBestCmap()[0x41]
              glyph = font["glyf"][glyph_name]
              assert glyph.xMax - glyph.xMin == expected_width
          cjk_outlines = []
          for path in paths:
              font = TTFont(path)
              glyph_name = font.getBestCmap()[0x4E2D]
              cjk_outlines.append(font["glyf"][glyph_name].coordinates)
          assert cjk_outlines[0] != cjk_outlines[1]
          assert cjk_outlines[1] != cjk_outlines[2]

          # Hand-edited version strings must match the pinned source fonts.
          def source_version(path):
              name = TTFont(path)["name"].getDebugName(5)
              return re.match(r"Version (\d+\.\d+)", name)[1]
          inconsolata = source_version(source_path)
          wenkai = source_version(
              "../LxgwWenKai-Lite/fonts/TTF/LXGWWenKaiMonoLite-Regular.ttf"
          )
          total = f"{float(inconsolata) + float(wenkai):.3f}"
          assert build.VERSION.split(".")[:2] == total.split("."), build.VERSION
          for path in paths:
              description = TTFont(path)["name"].getDebugName(10)
              assert f"Inconsolata {inconsolata} " in description, description
              assert f" {wenkai} (" in description, description
          page = Path("web/index.html").read_text(encoding="utf-8")
          assert f"Inconsolata {inconsolata} + LXGW WenKai Mono Lite {wenkai}" in page
          PY

      - name: Package fonts and licenses
        id: package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="WenSolataMono-${GITHUB_REF_NAME}.zip"
          else
            name="WenSolataMono-${GITHUB_SHA:0:7}.zip"
          fi
          cd WenSolata-Mono
          zip -r "../$name" \
            OFL.txt \
            dist/WenSolataMono-Light.ttf \
            dist/WenSolataMono-Regular.ttf dist/WenSolataMono-Bold.ttf \
            site/WenSolataMono.css site/woff2
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wensolata-font-package
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: WenSolata-Mono/site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download font package
        uses: actions/download-artifact@v8
        with:
          name: wensolata-font-package
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
        run: |
          # Never replace a published package; release a fix as a new revision.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              grep -qxF "$PACKAGE_NAME" ||
              gh release upload "$GITHUB_REF_NAME" "release-assets/$PACKAGE_NAME"
            gh release edit "$GITHUB_REF_NAME" --draft=false \
              --title "WenSolata Mono $GITHUB_REF_NAME" \
              --notes-file RELEASE-NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "release-assets/$PACKAGE_NAME" \
              --title "WenSolata Mono $GITHUB_REF_NAME" \
              --notes-file RELEASE-NOTES.md
          fi

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: hanlhe/homebrew-wensolata-mono
          path: homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Update the Homebrew cask
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
        run: |
          # Pin the published package; a retried run keeps the earlier upload.
          digest=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name == env.PACKAGE_NAME) | .digest')
          [[ $digest == sha256:* ]]
          sed -i -e "s/^  version .*/  version \"${GITHUB_REF_NAME#v}\"/" \
            -e "s/^  sha256 .*/  sha256 \"${digest#sha256:}\"/" \
            Casks/font-wensolata-mono.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update WenSolata Mono to ${GITHUB_REF_NAME#v}"
          git push

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web fonts
        id: deployment
        uses: actions/deploy-pages@v4
